x-app: &app
    image: ghcr.io/larsln/dinnertime:latest
    restart: unless-stopped
    env_file: .env
    volumes:
        - storage:/app/storage/app
    depends_on:
        db:
            condition: service_healthy

services:
    app:
        <<: *app
        environment:
            MIGRATE_ON_START: "true"
            CADDY_SERVER_EXTRA_DIRECTIVES: |
                mercure {
                    issuer dinnertime {
                        publisher {
                            jwt {env.MERCURE_JWT_KEY} HS256
                        }
                        subscriber {
                            jwt {env.MERCURE_JWT_KEY} HS256
                        }
                    }
                }
        ports:
            - "8000:80"

    queue:
        <<: *app
        command: sh -c "yt-dlp -U; php artisan queue:work --queue=default,imports"
        healthcheck:
            disable: true

    scheduler:
        <<: *app
        command: php artisan schedule:work
        healthcheck:
            disable: true

    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    storage:
    db-data:
