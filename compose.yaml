x-app: &app
    build:
        context: .
        target: dev
    volumes:
        - .:/app
    depends_on:
        db:
            condition: service_healthy

services:
    app:
        <<: *app
        env_file: .env
        environment:
            SERVER_NAME: ":80"
            CADDY_SERVER_EXTRA_DIRECTIVES: |
                mercure {
                    issuer mealplanner {
                        publisher {
                            jwt {env.MERCURE_JWT_KEY} HS256
                        }
                        subscriber {
                            jwt {env.MERCURE_JWT_KEY} HS256
                        }
                    }
                }
        ports:
            - "8000:80"

    queue:
        <<: *app
        command: sh -c "yt-dlp -U; php artisan queue:work --queue=default,imports"
        restart: unless-stopped
        healthcheck:
            disable: true

    scheduler:
        <<: *app
        command: php artisan schedule:work
        restart: unless-stopped
        healthcheck:
            disable: true

    vite:
        image: node:24-alpine
        working_dir: /app
        volumes:
            - .:/app
        command: sh -c "npm install && npm run dev"
        ports:
            - "5173:5173"

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: mealplanner
            POSTGRES_USER: mealplanner
            POSTGRES_PASSWORD: mealplanner
        volumes:
            - db-data:/var/lib/postgresql/data
            - ./docker/postgres:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U mealplanner"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    db-data:
